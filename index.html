<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Wallpaper Studio · 批量壁纸下载器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div>
      <h1>Infinity Wallpaper Studio</h1>
      <p>解码自 Infinity New Tab Pro 的云端壁纸图库 · 本地批量下载</p>
    </div>
  </div>
  <div class="top-stats">
    <div class="stat"><span id="statTotal">—</span><small>图库壁纸</small></div>
    <div class="stat"><span id="statDownloaded">0</span><small>本机已下载</small></div>
    <div class="stat"><span id="statSelected">0</span><small>已选择</small></div>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btnReport">解码报告</button>
    <button class="btn ghost" id="btnResetHistory" title="清除本机下载去重记录">重置记录</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-title">筛选条件</div>

    <label class="field">
      <span>图片来源</span>
      <select id="source"></select>
    </label>
    <label class="field">
      <span>主题标签</span>
      <select id="tag"></select>
    </label>
    <label class="field">
      <span>排序方式</span>
      <select id="order"></select>
    </label>

    <div class="field">
      <span>主色调</span>
      <div class="swatches" id="colors"></div>
    </div>

    <label class="field">
      <span>关键词（来源 / ID / 分辨率）</span>
      <input id="q" type="text" placeholder="例如 Unsplash、1920">
    </label>

    <div class="field-row">
      <label class="field">
        <span>最小宽度 px</span>
        <input id="minWidth" type="number" min="0" step="100" value="0">
      </label>
      <label class="field">
        <span>最少点赞</span>
        <input id="minLikes" type="number" min="0" step="10" value="0">
      </label>
    </div>

    <button class="btn primary wide" id="btnApply">应用筛选</button>
    <button class="btn light wide" id="btnResetFilter">重置筛选</button>

    <div class="side-note">
      <b>数据源</b>
      <code>api.inftab.com/v2/get_wallpaper_list</code>
      <p>公开只读接口，每页 50 张。下载器默认并发 4、翻页间隔 200ms，请保持克制。</p>
    </div>
  </aside>

  <main class="content">
    <div class="toolbar">
      <div class="pager">
        <button class="btn light" id="btnPrev">← 上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button class="btn light" id="btnNext">下一页 →</button>
      </div>
      <div class="toolbar-right">
        <span class="muted" id="pageCount">—</span>
        <button class="btn light" id="btnSelectAll">全选本页</button>
        <button class="btn light" id="btnClear">清空选择</button>
      </div>
    </div>

    <div id="loading" class="loading">正在读取云端图库…</div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>没有符合条件的壁纸，换个筛选试试。</div>
  </main>
</div>

<footer class="dock">
  <div class="dock-left">
    <div class="dock-line">
      <span class="dock-label">保存目录</span>
      <input id="outDir" type="text" class="grow">
      <button class="btn light" id="btnOpenFolder">打开</button>
    </div>
    <div class="dock-line small">
      <label>尺寸 <select id="width"></select></label>
      <label>并发 <select id="concurrency">
        <option value="1">1</option><option value="2">2</option>
        <option value="4" selected>4</option><option value="6">6</option><option value="8">8</option>
      </select></label>
      <label class="check"><input type="checkbox" id="skipExisting" checked> 跳过已下载</label>
      <label class="check"><input type="checkbox" id="overwrite"> 覆盖同名文件</label>
      <label class="check"><input type="checkbox" id="saveManifest" checked> 保存 CSV 清单</label>
    </div>
  </div>
  <div class="dock-right">
    <div class="dock-line">
      <span class="dock-label">批量页数</span>
      <input id="batchPages" type="number" min="1" max="200" value="5" title="从当前页开始连续抓取多少页">
      <button class="btn primary" id="btnBatchDownload">按筛选批量下载</button>
    </div>
    <div class="dock-line">
      <button class="btn accent" id="btnDownloadSelected">下载选中 (<span id="selCount">0</span>)</button>
    </div>
  </div>
</footer>

<section class="job-panel" id="jobPanel" hidden>
  <div class="job-head">
    <b id="jobTitle">下载任务</b>
    <span id="jobPhase">准备中</span>
    <button class="btn light tiny" id="btnCancel">取消任务</button>
    <button class="btn ghost tiny" id="btnCloseJob">收起</button>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="job-meta">
    <span id="jobCounts">0 / 0</span>
    <span id="jobMessage">—</span>
  </div>
  <div class="job-logs" id="jobLogs"></div>
</section>

<div class="modal" id="reportModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h2>图库解码报告</h2>
        <p>按证据优先的逆向方法记录：观察 → 推导 → 推断 → 只读验证</p>
      </div>
      <button class="btn ghost" id="btnCloseReport">关闭</button>
    </div>
    <div class="modal-body" id="reportBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
